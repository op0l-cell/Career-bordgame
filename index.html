<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Career Quiz</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- หน้าเลือกอาชีพ -->
    <div id="careerPage">

        <h1>เลือกอาชีพ</h1>

        <button onclick="selectCareer('หมอ')">👨‍⚕️ หมอ</button>

        <button onclick="selectCareer('พยาบาล')">👩‍⚕️ พยาบาล</button>

        <button onclick="selectCareer('ครู')">👩‍🏫 ครู</button>

        <button onclick="selectCareer('นักออกแบบ')">🎨 นักออกแบบ</button>

    </div>


    <!-- หน้าเริ่มเกม -->
    <div id="gamePage" style="display:none;">

        <h2 id="careerTitle"></h2>

        <button onclick="startGame()">
            เริ่มวันได้
        </button>

    </div>


    <!-- หน้าคำถาม -->
    <div id="questionPage" style="display:none;">

        <h2 id="question"></h2>

        <button id="choice1"></button>

        <button id="choice2"></button>
        <button id="choice3"></button>
    

    </div>


    <!-- หน้าฉากจบ -->
    <div id="endingPage" style="display:none;">

        <h1>จบเกม</h1>

        <h2 id="endingText"></h2>

        <h3>ค่าสถานะของคุณ</h3>

        <p>🧠 การคิดวิเคราะห์ : <span id="analysisScore">0</span></p>

        <p>🧩 การแก้ปัญหา : <span id="problemScore">0</span></p>

        <p>🗣️ การสื่อสาร : <span id="communicationScore">0</span></p>

        <p>❤️ การช่วยเหลือผู้อื่น : <span id="helpScore">0</span></p>

        <p>🎨 ความคิดสร้างสรรค์ : <span id="creativeScore">0</span></p>

        <p>💪 การอดทน/รับแรงกดดัน : <span id="pressureScore">0</span></p>

        <p>⏰ การจัดการเวลา : <span id="timeScore">0</span></p>

        <button onclick="location.reload()">
            เล่นใหม่
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
